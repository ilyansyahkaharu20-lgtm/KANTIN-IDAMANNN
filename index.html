<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantin Idaman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kuning: '#FFD600',
                        oren: '#FFAB00',
                        gelap: '#212121',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-amber-50 font-poppins min-h-screen flex justify-center items-center p-4">

    <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl overflow-hidden border-4 border-kuning">
        
        <!-- HEADER -->
        <div class="bg-kuning text-gelap p-5 text-center font-bold text-2xl uppercase tracking-wider">
            🍱 KANTIN IDAMAN
        </div>

        <!-- ============================================== -->
        <!-- STEP 1: PILIH MENU & JUMLAH -->
        <!-- ============================================== -->
        <div id="step1" class="p-6">
            <h3 class="text-lg font-bold mb-4 border-b-2 border-kuning pb-2">1. Pilih Menu</h3>
            
            <div class="space-y-3 mb-5">
                <!-- MAKANAN -->
                <button onclick="pilihMenu('Nasi Goreng', 15000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🍛 Nasi Goreng <span class="float-right">Rp 15.000</span>
                </button>
                <button onclick="pilihMenu('Mie Goreng', 12000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🍜 Mie Goreng <span class="float-right">Rp 12.000</span>
                </button>
                <button onclick="pilihMenu('Mie Kuah', 12000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🍲 Mie Kuah <span class="float-right">Rp 12.000</span>
                </button>
                <button onclick="pilihMenu('Ayam Geprek', 18000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🍗 Ayam Geprek <span class="float-right">Rp 18.000</span>
                </button>
                <button onclick="pilihMenu('Telur Goreng', 5000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🍳 Telur Goreng <span class="float-right">Rp 5.000</span>
                </button>
                <button onclick="pilihMenu('Telur Balado', 6000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🌶️ Telur Balado <span class="float-right">Rp 6.000</span>
                </button>

                <!-- MINUMAN -->
                <button onclick="pilihMenu('Es Teh Manis', 3000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🧋 Es Teh Manis <span class="float-right">Rp 3.000</span>
                </button>
                <button onclick="pilihMenu('Es Batu', 2000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🧊 Es Batu <span class="float-right">Rp 2.000</span>
                </button>
                <button onclick="pilihMenu('Pop Ice', 4000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🍹 Pop Ice <span class="float-right">Rp 4.000</span>
                </button>
            </div>

            <!-- INPUT JUMLAH -->
            <div id="inputJumlahSection" class="hidden mb-4">
                <label class="block text-sm font-semibold mb-2">Mau berapa porsi <span id="labelMenu" class="text-oren"></span>?</label>
                <input type="number" id="inputJumlah" value="1" min="1" class="w-full p-3 border-2 border-kuning rounded-xl text-center text-xl font-bold">
                <button onclick="tambahKeKeranjang()" class="w-full mt-2 bg-green-500 text-white py-2 rounded-xl font-bold">
                    ✅ Tambahkan ke Pesanan
                </button>
            </div>

            <div id="keranjang" class="hidden bg-gray-50 p-4 rounded-xl mb-4">
                <h4 class="font-bold text-sm text-gray-600 mb-2">📝 Daftar Pesanan:</h4>
                <div id="listPesan"></div>
                <div class="mt-3 pt-3 border-t border-dashed font-bold text-right text-lg">
                    Total: <span id="totalHarga" class="text-red-500">Rp 0</span>
                </div>
            </div>

            <button onclick="cekStok()" class="w-full bg-kuning text-gelap py-3 rounded-xl font-bold text-lg hover:bg-oren transition-all mt-3">
                LANJUT ➡️
            </button>
        </div>

        <!-- ============================================== -->
        <!-- STEP 2: CEK STOK -->
        <!-- ============================================== -->
        <div id="step2" class="p-6 hidden">
            <h3 class="text-lg font-bold mb-4 border-b-2 border-kuning pb-2">2. Cek Ketersediaan</h3>
            
            <div class="text-center p-5 bg-gray-100 rounded-xl mb-5">
                <p class="text-base mb-4">Menu yang dipesan:</p>
                <p id="cekMenu" class="font-bold text-xl text-oren"></p>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="stokTidakAda()" class="bg-red-100 text-red-600 py-3 rounded-xl font-bold">
                    ❌ HABIS / TIDAK ADA
                </button>
                <button onclick="stokAda()" class="bg-green-100 text-green-600 py-3 rounded-xl font-bold">
                    ✅ TERSEDIA
                </button>
            </div>
        </div>

        <!-- ============================================== -->
        <!-- STEP 3: PEMBAYARAN -->
        <!-- ============================================== -->
        <div id="step3" class="p-6 hidden">
            <h3 class="text-lg font-bold mb-4 border-b-2 border-kuning pb-2">3. Pembayaran</h3>
            
            <div class="grid grid-cols-3 gap-3 mb-5">
                <button onclick="pilihMetode('Tunai')" id="btnTunai" class="bg-gray-200 p-3 rounded-xl text-center font-semibold">
                    💰 Tunai
                </button>
                <button onclick="pilihMetode('Debit')" id="btnDebit" class="bg-gray-200 p-3 rounded-xl text-center font-semibold">
                    💳 Debit
                </button>
                <button onclick="pilihMetode('QRIS')" id="btnQRIS" class="bg-gray-200 p-3 rounded-xl text-center font-semibold">
                    📱 QRIS
                </button>
            </div>

            <div class="bg-blue-50 p-4 rounded-xl mb-4 text-center">
                <p class="text-sm text-gray-600">Total Bayar</p>
                <p id="tagihan" class="font-bold text-2xl text-blue-700"></p>
            </div>

            <!-- AREA QR CODE -->
            <div id="areaQR" class="hidden text-center mb-4">
                <p class="text-sm font-semibold mb-2">📷 Scan disini:</p>
                <div class="bg-white p-3 inline-block rounded-xl border-2 border-dashed border-gray-400">
                    <span style="font-size: 80px;">🆇</span>
                </div>
            </div>

            <div class="mb-4">
                <label id="labelUang" class="block text-sm font-semibold mb-2">Masukkan Jumlah:</label>
                <input type="number" id="inputUang" placeholder="Contoh: 20000" class="w-full p-3 border-2 border-kuning rounded-xl text-center text-xl font-bold">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="bayarGagal()" class="bg-red-100 text-red-600 py-3 rounded-xl font-bold">
                    ❌ GAGAL
                </button>
                <button onclick="bayarSukses()" class="bg-green-100 text-green-600 py-3 rounded-xl font-bold">
                    ✅ SUKSES
                </button>
            </div>
        </div>

        <!-- ============================================== -->
        <!-- STEP 4: SELESAI -->
        <!-- ============================================== -->
        <div id="step4" class="p-6 hidden text-center">
            <h3 class="text-lg font-bold mb-4 border-b-2 border-kuning pb-2">4. Penyajian</h3>

            <div class="text-6xl mb-4">👨‍🍳</div>
            <p id="statusMasak" class="font-bold text-lg mb-2 text-oren">Sedang dimasak...</p>
            <p id="infoBayar" class="text-sm text-gray-600 mb-5"></p>

            <button onclick="selesai()" class="w-full bg-kuning text-gelap py-3 rounded-xl font-bold text-xl hover:bg-oren">
                🎉 SELESAI / END
            </button>
        </div>

    </div>

    <script>
        // VARIABEL GLOBAL
        let keranjang = [];
        let totalBayar = 0;
        let tempNama, tempHarga;
        let metodeBayar = "";

        // 1. PILIH MENU
        function pilihMenu(nama, harga) {
            tempNama = nama;
            tempHarga = harga;
            document.getElementById('labelMenu').innerText = nama;
            document.getElementById('inputJumlahSection').classList.remove('hidden');
            document.getElementById('inputJumlah').value = 1;
        }

        function tambahKeKeranjang() {
            let jumlah = parseInt(document.getElementById('inputJumlah').value);
            let subtotal = tempHarga * jumlah;

            keranjang.push({
                nama: tempNama,
                harga: tempHarga,
                jumlah: jumlah,
                subtotal: subtotal
            });

            tampilkanKeranjang();
            document.getElementById('inputJumlahSection').classList.add('hidden');
        }

        function tampilkanKeranjang() {
            document.getElementById('keranjang').classList.remove('hidden');
            const listEl = document.getElementById('listPesan');
            listEl.innerHTML = "";
            totalBayar = 0;

            keranjang.forEach(item => {
                totalBayar += item.subtotal;
                listEl.innerHTML += `
                    <div class="flex justify-between text-sm mb-1">
                        <span>${item.nama} <b>x${item.jumlah}</b></span>
                        <span>Rp ${item.subtotal.toLocaleString()}</span>
                    </div>
                `;
            });

            document.getElementById('totalHarga').innerText = `Rp ${totalBayar.toLocaleString()}`;
        }

        function cekStok() {
            if(totalBayar === 0) {
                alert("⚠️ Silakan pilih menu dulu!");
                return;
            }
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('cekMenu').innerText = keranjang.map(i => i.nama).join(", ");
        }

        // 2. CEK STOK
        function stokAda() {
            alert("✅ Menu TERSEDIA!");
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
            document.getElementById('tagihan').innerText = `Rp ${totalBayar.toLocaleString()}`;
        }

        function stokTidakAda() {
            alert("❌ Menu HABIS! Silakan pilih lain.");
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
        }

        // 3. PILIH METODE & BAYAR
        function pilihMetode(metode) {
            metodeBayar = metode;
            
            // Reset warna
            document.getElementById('btnTunai').className = 'bg-gray-200 p-3 rounded-xl text-center font-semibold';
            document.getElementById('btnDebit').className = 'bg-gray-200 p-3 rounded-xl text-center font-semibold';
            document.getElementById('btnQRIS').className = 'bg-gray-200 p-3 rounded-xl text-center font-semibold';
            document.getElementById('areaQR').classList.add('hidden');

            // Warna aktif
            if(metode === 'Tunai') {
                document.getElementById('btnTunai').className = 'bg-kuning/50 p-3 rounded-xl text-center font-semibold border-2 border-oren';
                document.getElementById('labelUang').innerText = "Masukkan Uang Tunai:";
            } else if(metode === 'Debit') {
                document.getElementById('btnDebit').className = 'bg-kuning/50 p-3 rounded-xl text-center font-semibold border-2 border-oren';
                document.getElementById('labelUang').innerText = "Cek Saldo Kartu:";
            } else {
                document.getElementById('btnQRIS').className = 'bg-kuning/50 p-3 rounded-xl text-center font-semibold border-2 border-oren';
                document.getElementById('labelUang').innerText = "Scan & Masukkan Nominal:";
                document.getElementById('areaQR').classList.remove('hidden');
            }
        }

        function bayarSukses() {
            let uang = parseInt(document.getElementById('inputUang').value) || 0;
            if(!metodeBayar) {
                alert("⚠️ Pilih metode bayar dulu!");
                return;
            }

            if(uang >= totalBayar) {
                document.getElementById('step3').classList.add('hidden');
                document.getElementById('step4').classList.remove('hidden');
                document.getElementById('statusMasak').innerText = "🍽️ Siap disajikan!";
                
                let info = `Metode: ${metodeBayar}`;
                if(metodeBayar === 'Tunai') {
                    let kembali = uang - totalBayar;
                    info += `<br>Kembalian: Rp ${kembali.toLocaleString()}`;
                } else {
                    info += `<br>Transaksi Berhasil`;
                }
                document.getElementById('infoBayar').innerHTML = info;

            } else {
                alert("❌ Uang kurang!");
            }
        }

        function bayarGagal() {
            alert(`❌ PEMBAYARAN GAGAL!`);
            document
