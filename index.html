<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantin Idaman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kuning: '#FFD600',
                        oren: '#FFAB00',
                        gelap: '#212121',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-amber-50 font-poppins min-h-screen flex justify-center items-center p-4">

    <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl overflow-hidden border-4 border-kuning">
        
        <!-- HEADER -->
        <div class="bg-kuning text-gelap p-5 text-center font-bold text-2xl uppercase tracking-wider">
            🍱 Kantin Idaman
        </div>

        <!-- ============================================== -->
        <!-- STEP 1: PILIH MENU & JUMLAH -->
        <!-- ============================================== -->
        <div id="step1" class="p-6">
            <h3 class="text-lg font-bold mb-4 border-b-2 border-kuning pb-2">1. Pilih Menu & Jumlah</h3>
            
            <div class="space-y-3 mb-5">
                <!-- Menu Utama -->
                <button onclick="pilihMenu('Nasi Goreng', 15000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🍛 Nasi Goreng <span class="float-right">Rp 15.000</span>
                </button>
                <button onclick="pilihMenu('Mie Goreng', 12000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🍜 Mie Goreng <span class="float-right">Rp 12.000</span>
                </button>
                <button onclick="pilihMenu('Ayam Geprek', 18000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🍗 Ayam Geprek <span class="float-right">Rp 18.000</span>
                </button>
                <button onclick="pilihMenu('Nasi Ayam Lalapan', 16000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🍚 Nasi Ayam Lalapan <span class="float-right">Rp 16.000</span>
                </button>
                <button onclick="pilihMenu('Mie Cakalang', 17000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🍜 Mie Cakalang <span class="float-right">Rp 17.000</span>
                </button>
                <button onclick="pilihMenu('Nasi Telur', 10000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🍳 Nasi Telur <span class="float-right">Rp 10.000</span>
                </button>
                <button onclick="pilihMenu('Mi Kuah / Milu Siram', 11000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🍲 Mi Kuah / Milu Siram <span class="float-right">Rp 11.000</span>
                </button>

                <!-- Gorengan & Camilan -->
                <button onclick="pilihMenu('Pisang Goreng', 5000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🍌 Pisang Goreng <span class="float-right">Rp 5.000</span>
                </button>
                <button onclick="pilihMenu('Tempe Goreng', 2000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🧆 Tempe Goreng <span class="float-right">Rp 2.000</span>
                </button>
                <button onclick="pilihMenu('Bakwan Sayur', 3000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🥬 Bakwan Sayur <span class="float-right">Rp 3.000</span>
                </button>
                <button onclick="pilihMenu('Tahu Isi', 4000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🥟 Tahu Isi <span class="float-right">Rp 4.000</span>
                </button>
                <button onclick="pilihMenu('Basreng', 8000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🌶️ Basreng <span class="float-right">Rp 8.000</span>
                </button>

                <!-- Minuman -->
                <button onclick="pilihMenu('Es Teh Manis', 3000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    🧋 Es Teh Manis <span class="float-right">Rp 3.000</span>
                </button>
                <button onclick="pilihMenu('Air Mineral', 3000)" class="w-full bg-kuning/20 hover:bg-kuning/50 p-3 rounded-xl font-semibold transition-all text-left">
                    💧 Air Mineral <span class="float-right">Rp 3.000</span>
                </button>
            </div>

            <!-- INPUT JUMLAH -->
            <div id="inputJumlahSection" class="hidden mb-4">
                <label class="block text-sm font-semibold mb-2">Mau berapa porsi <span id="labelMenu" class="text-oren"></span>?</label>
                <input type="number" id="inputJumlah" value="1" min="1" class="w-full p-3 border-2 border-kuning rounded-xl text-center text-xl font-bold">
                <button onclick="tambahKeKeranjang()" class="w-full mt-2 bg-green-500 text-white py-2 rounded-xl font-bold hover:bg-green-600 transition-all">
                    ✅ Tambahkan ke Pesanan
                </button>
            </div>

            <!-- KERANJANG PESANAN -->
            <div id="keranjang" class="hidden bg-gray-50 p-4 rounded-xl mb-4">
                <h4 class="font-bold text-sm text-gray-600 mb-2">📋 Pesanan Kamu:</h4>
                <div id="listPesan"></div>
                <div class="mt-3 pt-3 border-t border-dashed font-bold text-right text-lg">
                    Total: <span id="totalHarga" class="text-red-500">Rp 0</span>
                </div>
            </div>

            <button onclick="cekStok()" class="w-full bg-kuning text-gelap py-3 rounded-xl font-bold text-lg hover:bg-oren transition-all mt-2">
                Cek Ketersediaan ➡️
            </button>
        </div>

        <!-- ============================================== -->
        <!-- STEP 2: CEK STOK -->
        <!-- ============================================== -->
        <div id="step2" class="p-6 hidden">
            <h3 class="text-lg font-bold mb-4 border-b-2 border-kuning pb-2">2. Cek Stok Menu</h3>
            
            <div class="text-center p-5 bg-gray-100 rounded-xl mb-5">
                <p class="text-base mb-4">Menu yang dipilih:</p>
                <p id="cekMenu" class="font-bold text-xl text-oren"></p>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="stokTidakAda()" class="bg-red-100 text-red-600 py-3 rounded-xl font-bold hover:bg-red-200 transition-all">
                    ❌ Tidak Tersedia
                </button>
                <button onclick="stokAda()" class="bg-green-100 text-green-600 py-3 rounded-xl font-bold hover:bg-green-200 transition-all">
                    ✅ Tersedia
                </button>
            </div>
        </div>

        <!-- ============================================== -->
        <!-- STEP 3: PILIH METODE BAYAR -->
        <!-- ============================================== -->
        <div id="step3" class="p-6 hidden">
            <h3 class="text-lg font-bold mb-4 border-b-2 border-kuning pb-2">3. Pilih Pembayaran</h3>
            
            <div class="grid grid-cols-3 gap-3 mb-5">
                <button onclick="pilihMetode('Tunai')" id="btnTunai" class="bg-gray-200 p-3 rounded-xl text-center font-semibold hover:bg-gray-300 transition-all">
                    💰 Tunai
                </button>
                <button onclick="pilihMetode('Debit')" id="btnDebit" class="bg-gray-200 p-3 rounded-xl text-center font-semibold hover:bg-gray-300 transition-all">
                    💳 Debit
                </button>
                <button onclick="pilihMetode('QRIS')" id="btnQRIS" class="bg-gray-200 p-3 rounded-xl text-center font-semibold hover:bg-gray-300 transition-all">
                    📱 QRIS
                </button>
            </div>

            <div class="bg-blue-50 p-4 rounded-xl mb-4 text-center">
                <p class="text-sm text-gray-600">Total Tagihan</p>
                <p id="tagihan" class="font-bold text-2xl text-blue-700"></p>
            </div>

            <div class="mb-4">
                <label id="labelUang" class="block text-sm font-semibold mb-2">Masukkan Jumlah Uang:</label>
                <input type="number" id="inputUang" placeholder="Contoh: 20000" class="w-full p-3 border-2 border-kuning rounded-xl text-center text-xl font-bold">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="bayarGagal()" class="bg-red-100 text-red-600 py-3 rounded-xl font-bold hover:bg-red-200 transition-all">
                    ❌ GAGAL
                </button>
                <button onclick="bayarSukses()" class="bg-green-100 text-green-600 py-3 rounded-xl font-bold hover:bg-green-200 transition-all">
                    ✅ SUKSES
                </button>
            </div>
        </div>

        <!-- ============================================== -->
        <!-- STEP 4: PROSES AKHIR / PENYAJIAN -->
        <!-- ============================================== -->
        <div id="step4" class="p-6 hidden text-center">
            <h3 class="text-lg font-bold mb-4 border-b-2 border-kuning pb-2">4. Penyajian</h3>

            <div class="text-6xl mb-4">👨‍🍳</div>
            <p id="statusMasak" class="font-bold text-lg mb-5 text-oren"></p>
            <div id="infoBayar" class="text-sm text-gray-600 mb-5 p-3 bg-gray-50 rounded-xl"></div>

            <button onclick="selesai()" class="w-full bg-kuning text-gelap py-3 rounded-xl font-bold text-xl hover:bg-oren transition-all">
                🎉 SELESAI / KEMBALI
            </button>
        </div>

    </div>

    <script>
        // DEKLARASI VARIABEL GLOBAL (DIPASTIKAN ADA AGAR TIDAK ERROR)
        let keranjang = [];
        let totalBayar = 0;
        let tempNama, tempHarga;
        let metodeBayar = "";

        // ==================================================
        // FUNGSI LANGKAH 1: PILIH MENU & KERANJANG
        // ==================================================
        function pilihMenu(nama, harga) {
            tempNama = nama;
            tempHarga = harga;
            document.getElementById('labelMenu').innerText = nama;
            document.getElementById('inputJumlahSection').classList.remove('hidden');
            document.getElementById('inputJumlah').value = 1;
        }

        function tambahKeKeranjang() {
            let jumlah = parseInt(document.getElementById('inputJumlah').value);
            
            // Validasi input agar tidak NaN / 0
            if (isNaN(jumlah) || jumlah <= 0) {
                alert("⚠️ Jumlah harus angka lebih dari 0!");
                return;
            }

            let subtotal = tempHarga * jumlah;

            keranjang.push({
                nama: tempNama,
                harga: tempHarga,
                jumlah: jumlah,
                subtotal: subtotal
            });

            tampilkanKeranjang();
            document.getElementById('inputJumlahSection').classList.add('hidden');
        }

        function tampilkanKeranjang() {
            document.getElementById('keranjang').classList.remove('hidden');
            const listEl = document.getElementById('listPesan');
            listEl.innerHTML = "";
            totalBayar = 0;

            keranjang.forEach((item, index) => {
                totalBayar += item.subtotal;
                listEl.innerHTML += `
                    <div class="flex justify-between text-sm mb-1">
                        <span>${index+1}. ${item.nama} <b>x${item.jumlah}</b></span>
                        <span>Rp ${item.subtotal.toLocaleString('id-ID')}</span>
                    </div>
                `;
            });

            document.getElementById('totalHarga').innerText = `Rp ${totalBayar.toLocaleString('id-ID')}`;
        }

        function cekStok() {
            if(totalBayar === 0 || keranjang.length === 0) {
                alert("⚠️ Silakan pilih menu dan masukkan jumlah dulu!");
                return;
            }
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('cekMenu').innerText = keranjang.map(i => i.nama).join(", ");
        }

        // ==================================================
        // FUNGSI LANGKAH 2: CEK KETERSEDIAAN
        // ==================================================
        function stokAda() {
            alert("✅ Menu TERSEDIA! Lanjut ke pembayaran.");
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
            document.getElementById('tagihan').innerText = `Rp ${totalBayar.toLocaleString('id-ID')}`;
        }

        function stokTidakAda() {
            alert("❌ Menu HABIS! Silakan pilih menu lain.");
            // Reset keranjang jika stok habis
            keranjang = [];
            totalBayar = 0;
